# Beeper's email look (see dna-admin's copy of this file for what each key does). Beeper is a
# dark, neon brand, so emails are always dark: color_scheme "dark" stops clients inverting them.

color_scheme: "dark"

# Deep purple page with neon notes, sparkles and equalizer bars (public/email/pattern-*.png).
page_bg: "#0a0020"
page_bg_dark: "#0a0020"
pattern: "/email/pattern-light.png"
pattern_dark: "/email/pattern-dark.png"

# Glassy dark card.
card_bg: "#140a2e"
card_bg_dark: "#140a2e"
card_border: "#2b1d5c"
card_border_dark: "#2b1d5c"
rule: "#2b1d5c"
rule_dark: "#2b1d5c"
radius: "16px"

text: "#f2f0ff"
text_dark: "#f2f0ff"
muted: "#a9a3c9"
muted_dark: "#a9a3c9"
footer: "#a9a3c9"
footer_dark: "#a9a3c9"
# A dark panel keeps the footer readable over the busy neon tile.
footer_bg: "#0a0020"

# Neon cyan stars and links; cyan button with dark text.
accent: "#00ffff"
accent_dark: "#00ffff"
link: "#00e5ff"
link_dark: "#00e5ff"
button_bg: "#00ffff"
button_text: "#0a0020"
button_bg_dark: "#00ffff"
button_text_dark: "#0a0020"

# The logo glows yellow and pink, so it sits on a dark badge with a cyan edge.
badge_bg: "#0a0020"
badge_border: "#00ffff"
badge_shadow: "0 0 18px rgba(0,255,255,0.35)"

heading_font: "'Michroma','Arial Black',Helvetica,Arial,sans-serif"
body_font: "Helvetica,Arial,sans-serif"

# Used until a Mailer logo is uploaded in Configurations > Stores.
default_logo: "/email/logo.png"
logo_height: 44
