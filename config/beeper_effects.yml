# The Beeper app's nine effects and their parameter ranges, for validating effect_preset manifests
# (app/services/beeper/manifests/effect_preset.rb, read through Beeper::Effects).
#
# Copied from BeeperNative origin/main f483f2b0730db36f6ef24d31db4a7b1908cb025b:
#   src/data/effects.ts   EFFECTS (ids, params, min, max, default, step)
#   src/atoms/studio.ts   EFFECT_ORDER (the order below)
# The app clamps preset values to these ranges too. When the app adds an effect or changes a range,
# update this file and test/services/beeper/effects_test.rb together.
#
# Units: percent params are 0..1; echo.time is seconds; compressor attack/release are ms; eq and
# compressor gains are dB. toggle params are 0 or 1; choice params index echo.division
# (1/4, 1/8, 1/8 dotted, 1/16, 1/4 dotted, 1/2) and pump.division (1/4, 1/8, 1/2, 1 bar).
effects:
  drive:
    amount: { min: 0, max: 1, default: 0.4, step: 0.01 }
    tone: { min: 0, max: 1, default: 0.6, step: 0.01 }
    mix: { min: 0, max: 1, default: 1, step: 0.01 }
  crush:
    bits: { min: 2, max: 16, default: 8, step: 1 }
    downsample: { min: 1, max: 32, default: 4, step: 1 }
    noise: { min: 0, max: 1, default: 0.1, step: 0.01 }
    mix: { min: 0, max: 1, default: 1, step: 0.01 }
  eq:
    low: { min: -12, max: 12, default: 0, step: 0.5 }
    mid: { min: -12, max: 12, default: 0, step: 0.5 }
    midFreq: { min: 200, max: 5000, default: 1000, step: 10 }
    high: { min: -12, max: 12, default: 0, step: 0.5 }
  chorus:
    rate: { min: 0.05, max: 5, default: 0.8, step: 0.01 }
    depth: { min: 0, max: 1, default: 0.4, step: 0.01 }
    mix: { min: 0, max: 1, default: 0.5, step: 0.01 }
  phaser:
    rate: { min: 0.05, max: 5, default: 0.4, step: 0.01 }
    depth: { min: 0, max: 1, default: 0.6, step: 0.01 }
    feedback: { min: 0, max: 0.9, default: 0.5, step: 0.01 }
    mix: { min: 0, max: 1, default: 0.5, step: 0.01 }
  echo:
    time: { min: 0.02, max: 2, default: 0.375, step: 0.005 }
    sync: { min: 0, max: 1, default: 1, step: 1 }
    division: { min: 0, max: 5, default: 2, step: 1 }
    feedback: { min: 0, max: 0.95, default: 0.4, step: 0.01 }
    tone: { min: 0, max: 1, default: 0.5, step: 0.01 }
    pingPong: { min: 0, max: 1, default: 0, step: 1 }
    mix: { min: 0, max: 1, default: 0.35, step: 0.01 }
  reverb:
    size: { min: 0, max: 1, default: 0.6, step: 0.01 }
    damping: { min: 0, max: 1, default: 0.5, step: 0.01 }
    width: { min: 0, max: 1, default: 1, step: 0.01 }
    mix: { min: 0, max: 1, default: 0.3, step: 0.01 }
  pump:
    depth: { min: 0, max: 1, default: 0.6, step: 0.01 }
    shape: { min: 0, max: 1, default: 0.5, step: 0.01 }
    division: { min: 0, max: 3, default: 0, step: 1 }
  compressor:
    threshold: { min: -60, max: 0, default: -18, step: 0.5 }
    ratio: { min: 1, max: 20, default: 4, step: 0.1 }
    attack: { min: 0.1, max: 100, default: 10, step: 0.1 }
    release: { min: 10, max: 1000, default: 120, step: 1 }
    makeup: { min: 0, max: 24, default: 4, step: 0.5 }
