setup:
  addons:
    - plan: heroku-postgresql:essential-0
      as: DATABASE
build:
  docker:
    web: Dockerfile
release:
  image: web
  command:
    - echo "Migrations already loaded via schema:load"
run:
  web:
    command:
      - bundle
      - exec
      - puma
      - "-C"
      - config/puma.rb