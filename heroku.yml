setup:
  addons:
    - plan: heroku-postgresql:essential-0
      as: DATABASE
build:
  docker:
    web: Dockerfile
release:
  image: web
  command:
    - bundle exec rails db:migrate
run:
  web: bundle exec puma -C config/puma.rb
  asset-syncer:
    command:
      - python asset-syncer.py
    image: worker